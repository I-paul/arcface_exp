services:

  # ETCD - Milvus Metadata Storage
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - app-network

  # MINIO - Milvus Object Storage
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - app-network

  # MILVUS - Vector Database
  milvus:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - COMMON_LOG_LEVEL=warning
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      - etcd
      - minio
    networks:
      - app-network

  # ATTU - Milvus GUI
  attu:
    image: zilliz/attu:latest
    ports:
      - "8888:3000"
    environment:
      - MILVUS_URL=milvus:19530
    networks:
      - app-network
    depends_on:
      - milvus

  # REDIS - Job Queue
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - app-network


  # POSTGRES - Primary Database
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ML SERVICE - Face Recognition API
  ml_service:
    build: ./ml_service
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ml_service_data:/app/data
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - PYTHONUNBUFFERED=1
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
    gpus: all

  # BACKEND - Express API Server
  backend:
    build: ./Backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    command: sh -c "npm run migrate && npm start"
    depends_on:
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ml_service:
        condition: service_started
    networks:
      - app-network
    environment:
      - NODE_ENV=development
      - ML_SERVICE_URL=http://ml_service:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STREAM_KEY=camera_ingestor:stream
      - GRACE_PERIOD_MINUTES=15
      - DB_HOST=postgres
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}

  # FRONTEND - React / Vite user interface
  frontend:
    image: node:18
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:3000"
    env_file:
      - .env
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=http://localhost:3000
      - VITE_WS_URL=http://localhost:3000
      - VITE_MOCK_MODE=true
    depends_on:
      - backend
    networks:
      - app-network

  # CAMERA INGESTOR - captures RTSP streams and writes frames to Redis stream
  camera-ingestor:
    build: ./camera_ingestor
    image: arcface/camera-ingestor:latest
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STREAM_KEY=camera_ingestor:stream
      - HEARTBEAT_TTL_S=60
      - SAMPLE_INTERVAL_S=0.3
      - JPEG_QUALITY=70
      - BACKEND_URL=http://backend:3000
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    depends_on:
      - redis
      - backend
      - postgres
    networks:
      - app-network

# NETWORKS
networks:
  app-network:
    driver: bridge

# VOLUMES
volumes:
  ml_service_data:
  etcd_data:
  minio_data:
  milvus_data:
  postgres_data:
  redis_data:
  frontend_node_modules:
