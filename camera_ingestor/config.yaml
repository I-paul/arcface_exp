# Camera ingestor configuration (TEMPLATE)
# This file is not read at runtime — cameras are loaded from the database.
# Kept as a reference for the config format.

cameras:
  - cam_id: cam-1
    site_id: site-A
    rtsp: "rtsp://<user>:<pass>@<camera-ip>:554/stream"
    sample_interval_s: 2

# Redis connection settings (overridden by environment variables at runtime)
redis:
  host: "localhost"
  port: 6379
  stream_key: "camera_ingestor:stream"
  heartbeat_ttl_s: 60
