# Camera ingestor configuration
# Define one or more cameras with their RTSP URL, cam_id and site_id.

cameras:
  - cam_id: cam-1
    site_id: site-A
    rtsp: "rtsp://user:pass@192.168.1.100:554/stream"
    sample_interval_s: 2        # fixed sampling every N seconds


  - cam_id: cam-2
    site_id: site-A
    rtsp: "rtsp://user:pass@192.168.1.101:554/stream"
    sample_interval_s: 5


# Redis connection settings
redis:
  host: "localhost"
  port: 6379
  stream_key: "camera_ingestor:stream"
  heartbeat_ttl_s: 60

# Motion detection parameters
motion:
  history: 500
  varThreshold: 16
  detectShadows: false
